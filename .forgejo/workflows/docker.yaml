name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Type of Build'
        required: true
        type: choice
        options:
          - pr
          - stable
          - dev
          - nightly
      version:
        description: 'version tag'
        required: false
        type: string
      branch:
        description: 'branch tag'
        required: false
        type: string
      push:
        description: 'push the image'
        default: false
        type: boolean

  workflow_call:
    inputs:
      type:
        description: 'One of pr/release/prerelease/dev'
        required: true
        type: string
      version:
        description: 'version tag'
        required: false
        type: string
      push:
        description: 'push the image'
        default: false
        type: boolean
      commit:
        description: 'commit hash'
        required: true
        type: string
env:
  IMAGE_NAME: christofsteel/syngtesting
  REGISTRY: git.k-fortytwo.de
  USERNAME: christofsteel
  PASSWORD: ${{ secrets.FJCR_PUSH }}
  REGISTRY2: ghcr.io
  USERNAME2: christofsteel
  PASSWORD2: ${{ secrets.GHCR_PUSH }}
  PUSH: ${{ github.event.inputs.push }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Get best tag
        id: tagname
        run: |
          SHA="commit-${{inputs.commit}}"
          case ${{ inputs.type }} in
          release)
          TAGS=(${SHA} $(echo ${{ inputs.version }} | sed "s/\([^\.]*\).\([^\.]*\).\(.*\)$/\1 \1.\2 \1.\2.\3 latest/"))
            ;;
          prerelease)
          TAGS=(${SHA} $(echo ${{ inputs.version }} | sed "s/\(.*\)/\1 prerelease/"))          
          ;;
          pr)
          TAGS=(${SHA} "pr-${{ inputs.commit }}")
            ;;
          dev)
          TAGS=(${SHA} nightly)
          ;;
          esac
          echo ${TAGS[@]}
          FULL_TAGS=$(for tag in ${TAGS[@]}; do echo ${{ env.REGISTRY2 }}/${{ env.IMAGE_NAME }}:${tag},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}; done | tr '\n' ',' | sed s/,$//)
          echo "TAGS=\"${FULL_TAGS}\"" >> "$GITHUB_OUTPUT"
      - name: Print tags
        run: echo ${{ steps.tagname.outputs.tags }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker login
        if: ${{ env.PUSH }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.FJCR_PUSH }}
      - name: Docker login (GH)
        if: ${{ env.PUSH }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY2 }}
          username: ${{ env.USERNAME2 }}
          password: ${{ secrets.GHCR_PUSH }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: resources/docker
          push: ${{ inputs.push }}
          tags: ${{ steps.tagname.outputs.tags }}
