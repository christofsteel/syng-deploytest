name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Type of Build'
        required: true
        type: choice
        options:
          - pr
          - stable
          - dev
          - nightly
      version:
        description: 'version tag'
        required: false
        type: string
      branch:
        description: 'branch tag'
        required: false
        type: string

  workflow_call:
    inputs:
      type:
        description: 'One of pr/stable/dev/nightly'
        required: true
        type: string
      version:
        description: 'version tag'
        required: false
        type: string
      branch:
        description: 'branch tag'
        required: false
        type: string
env:
  IMAGE_NAME: christofsteel/syngtesting
  REGISTRY: git.k-fortytwo.de
  USERNAME: christofsteel
  PASSWORD: ${{ secrets.FORGEJO_TOKEN }}
  REGISTRY2: ghcr.io
  USERNAME2: christofsteel
  PASSWORD: ${{ secrets.GHCR_PUSH }}
  PUSH: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Print event trigger
        run: echo ${{ github.event_name }} - ${{ inputs.type }}
      - name: check out repo
        uses: actions/checkout@v4
      - name: Get best tag
        id: tagname
        run: |
          SHA="commit-$(git rev-parse --short HEAD)"
          case ${{ inputs.type }} in
          stable)
          TAGS=(${SHA} $(echo ${{ inputs.version }} | sed "s/\([^\.]*\).\([^\.]*\).\(.*\)$/\1 \1.\2 \1.\2.\3 latest/"))
            ;;
          dev)
          TAGS=(${SHA} $(echo ${{ inputs.version }} | sed "s/\(.*\)/\1 prerelease/"))          
          ;;
          pr)
          TAGS=(${SHA} "pr-${{ inputs.branch }}")
            ;;
          nightly)
          TAGS=(${SHA} nightly)
          ;;
          esac
          echo ${TAGS[@]}
          echo ${{ inputs.version }} 
          FULL_TAGS=$(for tag in ${TAGS[@]}; do echo ${{ env.REGISTRY2 }}/${{ env.IMAGE_NAME }}:${tag},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}; done | tr '\n' ',' | sed s/,$//)
          echo "TAGS=\"${FULL_TAGS}\"" >> "$GITHUB_OUTPUT"
      - name: Print tags
        run: echo ${{ steps.tagname.outputs.tags }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ env.PASSWORD }}
      - name: Docker login (GH)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY2 }}
          username: ${{ env.USERNAME2 }}
          password: ${{ env.PASSWORD2 }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: resources/docker
          push: ${{ env.PUSH }}
          tags: ${{ steps.tagname.outputs.tags }}
