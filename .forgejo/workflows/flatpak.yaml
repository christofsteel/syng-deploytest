name: build flatpak
on:
  workflow_dispatch: {}

jobs:
  prepare-yaml-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flatpak and flatpak-builder
        uses: https://github.com/awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: gettext-base python3-requirement-parser python3-yaml
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"      
      - name: Prepare Flatpak YAML files
        run: |
          chmod +x build_yaml.sh
          ./build_yaml.sh
        working-directory: resources/flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-yaml-files
          path: resources/flatpak
      
  build-flatpak:
    needs: prepare-yaml-files
    runs-on: flatpak-builder-base
    steps:
      # - name: Checkout repository
      #   uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-yaml-files
          path: .


        #

      - name: Build Flatpak
        uses: https://codeberg.org/jamiemurphy/flatpak-runtime-sdk@main
        with:
          manifest-path: resoruces/flatpak/rocks.syng.Syng.yaml
          module: Syng.Rocks!
          app-id: rocks.syng.Syng
          bundle: rocks.syng.Syng.flatpak


      # - name: Install Flatpak and flatpak-builder
      #   uses: https://github.com/awalsh128/cache-apt-pkgs-action@v1
      #   with:
      #     packages: gettext-base python3-requirement-parser python3-yaml


