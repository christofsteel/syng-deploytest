name: build flatpak
on:
  workflow_dispatch: {}

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gettext-base

      - name: Install requirements-parser
        run: uv pip install requirements-parser

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Prepare Flatpak YAML files
        run: |
          chmod +x build_yaml.sh
          ./build_yaml.sh
        working-directory: resources/flatpak
      - name: Build Flatpak
        run: flatpak-builder \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            build-dir \
            "rocks.syng.Syng.yaml" 
        working-directory: resources/flatpak
      - name: Build Flatpak Artifact
        run: flatpak build-bundle \
            ~/.local/share/flatpak/repo \
            "rocks.syng.Syng.flatpak" \
            "rocks.syng.Syng"
        working-directory: resources/flatpak
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: "*.flatpak"

      
