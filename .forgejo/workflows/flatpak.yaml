      #   run: |
      #     flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      #     flatpak-builder --force-clean --user --install-deps-from=flathub build-dir rocks.syng.Syng.yaml
      #   working-directory: resources/flatpak
      # - name: Build Flatpak Artifact
      #   run: flatpak build-bundle \
      #       ~/.local/share/flatpak/repo \
      #       "rocks.syng.Syng.flatpak" \
      #       "rocks.syng.Syng"
