name: build flatpak
on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: 'version tag'
        required: true
        type: string
      commit:
        description: 'commit hash'
        required: true
        type: string

env:
  TOKEN: ${{ secrets.GH_TESTREPO }}
  REPO: christofsteel/testrepo

jobs:
  prepare-yaml-files:
    runs-on: privileged-ubuntu-latest
    container: 
      image: git.k-fortytwo.de/christofsteel/syng-flatpakbuilder:1.0.0
    outputs:
      artifact_url: ${{ steps.artifact_url.outputs.artifact_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Prepare Flatpak YAML files
        run: |
          chmod +x build_yaml.sh
          dbus-daemon --system
          xvfb-run -a -s "-screen 0 1024x768x24" -- \
          dbus-run-session \
          ./build_yaml.sh
        working-directory: resources/flatpak
      - uses: actions/upload-artifact@v3
        with:
          name: flatpak-yaml-files
          path: resources/flatpak/dist
      - name: Print artifact url
        id: artifact_url
        run: echo "artifact_url=https://git.k-fortytwo.de/christofsteel/syng-deploytest/actions/runs/${{ forgejo.run_id }}/artifacts/flatpak-yaml-files" >> $FORGEJO_OUTPUT
      
  build-flatpak:
    needs: prepare-yaml-files
    runs-on: privileged-ubuntu-latest
    container: 
      image: git.k-fortytwo.de/christofsteel/syng-flatpakbuilder:1.0.0
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: flatpak-yaml-files
          path: .

      - name: Build Flatpak
        run: |
          dbus-daemon --system
          xvfb-run -a -s "-screen 0 1024x768x24" -- \
          dbus-run-session \
          flatpak run --user --command=flathub-build org.flatpak.Builder --disable-rofiles-fuse --repo=repo rocks.syng.Syng.yaml
      - name: Build Flatpak Artifact
        run: flatpak build-bundle /workspace/christofsteel/syng-deploytest/repo "rocks.syng.Syng.flatpak" "rocks.syng.Syng"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v3
        with:
          name: flatpak-bundle
          path: "*.flatpak"

  call-flathub-build:
    needs: prepare-yaml-files
    uses: ./.forgejo/workflows/external.yaml
    with:
      repo: christofsteel/testrepo
      event: test-event
      payload: '{"url": "${{ needs.prepare-yaml-files.outputs.artifact_url }}"}'
    secrets:
      token: ${{ secrets.GH_TESTREPO }}
