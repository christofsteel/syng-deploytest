name: build flatpak
on:
  workflow_dispatch: {}

jobs:
  prepare-yaml-files:
    runs-on: privileged-ubuntu-latest
    container: 
      image: git.k-fortytwo.de/christofsteel/syng-flatpakbuilder:1.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare Flatpak YAML files
        run: |
          chmod +x build_yaml.sh
          dbus-daemon --system
          xvfb-run -a -s "-screen 0 1024x768x24" -- \
          dbus-run-session \
          ./build_yaml.sh
        working-directory: resources/flatpak
      - uses: actions/upload-artifact@v3
        with:
          name: flatpak-yaml-files
          path: resources/flatpak
      - name: Print artifact url
        run: echo "https://git.k-fortytwo.de/christofsteel/syng-deploytest/actions/runs/${{ forgejo.run_id }}/artifacts/flatpak-yaml-files"
      
  build-flatpak:
    needs: prepare-yaml-files
    runs-on: privileged-ubuntu-latest
    container: 
      image: git.k-fortytwo.de/christofsteel/syng-flatpakbuilder:1.0.0
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: flatpak-yaml-files
          path: .

      - name: Build Flatpak
        run: |
          dbus-daemon --system
          xvfb-run -a -s "-screen 0 1024x768x24" -- \
          dbus-run-session \
          flatpak run --user --command=flathub-build org.flatpak.Builder --disable-rofiles-fuse --repo=repo rocks.syng.Syng.yaml
      - name: Build Flatpak Artifact
        run: flatpak build-bundle /workspace/christofsteel/syng-deploytest/repo "rocks.syng.Syng.flatpak" "rocks.syng.Syng"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v3
        with:
          name: flatpak-bundle
          path: "*.flatpak"

      
