name: Make a new Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Type of Release"
        required: true
        type: choice
        options:
          - release
          - prerelease
          - dev


jobs:
  update-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
      sha: ${{ steps.sha.outputs.SHA }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"      
      - name: check out repo
        uses: actions/checkout@v4
      - name: get current version
        run: |
          REPO_VERSION=$(uv version --short)
          echo "REPO_VERSION=${REPO_VERSION}" >> "$GITHUB_ENV"
      - name: Check for dev version
        run: |
          echo ${{ env.REPO_VERSION }}          
          if [[ "${{ env.REPO_VERSION }}" =~ ^[0-9]*\.[0-9]*\.[0-9]*$ ]]; then echo "This seems like an already released version"; false; else echo "looking good"; true; fi
      - name: set git credentials
        run: |
          git config --global user.name "Forgejo Action CI"
          git config --global user.email "git@git.k-fortytwo.de"
      - name: Bump to stable
        if: ${{ inputs.type == 'release' }}
        run: uv version --bump stable
      - name: get current version
        id: get-version
        run: |
          VERSION=$(uv version --short | sed 's/\.dev/-dev/')
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: check version against flatpak
        if: ${{ inputs.type == 'release' }}
        run: bash resources/flatpak/check-version.sh ${{ env.VERSION }} 
      - name: Create release-branch
        run: |
          git checkout -b "release-${{env.VERSION}}"
          git add pyproject.toml
          git commit -m "Update to version: ${{env.VERSION}}"
          git push origin "release-${{env.VERSION}}"
      - name: sha
        id: sha
        run: echo "SHA=$(git log -1 --format=%H)" >> $GITHUB_OUTPUT}

  build-wine:
    needs: update-version
    uses: ./.forgejo/workflows/wix.yaml
    with:
      version: ${{ needs.update-version.outputs.version }}
      commit: ${{ needs.update-version.outputs.sha }}

  build-docker:
    needs: update-version
    uses: ./.forgejo/workflows/docker.yaml
    with:
      version: ${{ needs.update-version.outputs.version }}
      commit: ${{ needs.update-version.outputs.sha }}
      push: "true"
      type: ${{ inputs.type }}
    secrets: inherit

  build-flatpak:
    needs: update-version
    uses: ./.forgejo/workflows/flatpak.yaml
    with:
      version: ${{ needs.update-version.outputs.version }}
      commit: ${{ needs.update-version.outputs.sha }}
    secrets:
      GH_TESTREPO: ${{secrets.GH_TESTREPO}}

  publish:
    needs: [build-wine, build-flatpak, build-docker, update-version]
    # needs: [build-flatpak, update-version]
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{needs.update-version.outputs.sha}}
      - name: Get tag
        id: tag
        run: |
            echo "TAG=v${{ needs.update-version.outputs.version }}" >> $GITHUB_OUTPUT
      - name: Check for stable version
        id: stable
        run: |
            echo "PRERELEASE=${{ inputs.type != 'release' }}" >> $GITHUB_OUTPUT
      - name: Print version
        run: |
          echo "Version: ${{ steps.tag.outputs.tag }}"
          echo "Prerelease: ${{ steps.stable.outputs.prerelease }}"
      - name: download artifact
        uses: actions/download-artifact@v3
        with:
          path: dist
      - name: list
        run: ls -Rlh dist/
      - name: clean
        run: rm -rf dist/flatpak-yaml-files
      - name: flatten
        run: mv dist/**/* dist/
      - run: |
          rmdir dist/* || true
      - name: set git credentials
        run: |
          git config --global user.name "Forgejo Action CI"
          git config --global user.email "git@git.k-fortytwo.de"
      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.tag }}
          git push --tags
      - run: |
          git log
          echo ${{ steps.update-version.outputs.sha }}
      - uses: actions/forgejo-release@v2.12.1
        with:
          direction: upload
          release-notes-assistant: true
          tag: ${{ steps.tag.outputs.tag }}
          sha: ${{ needs.update-version.outputs.sha }}
          release-dir: dist
          prerelease: ${{ steps.stable.outputs.prerelease }}

  cleanup:
    # needs: [build-docker, build-flatpak, build-docker, update-version]
    needs: [publish, update-version]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4        
      - name: Remove Branch
        run: |
          git push origin --delete release-${{needs.update-version.outputs.version}}
