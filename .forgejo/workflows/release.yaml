name: Make a new Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Type of Release"
        required: true
        type: choice
        options:
          - release
          - prerelease
          - dev

jobs:
  prepare:
    uses: ./.forgejo/workflows/prepare.yaml
    with:
      release: ${{ inputs.release }}
      flatpak: ${{ inputs.flatpak }}

  debug:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: print
        run: |
          echo version ${{ needs.prepare.outputs.version }}
          echo commit ${{ needs.prepare.outputs.commit }}

  build:
    needs: prepare
    uses: ./.forgejo/workflows/build.yaml
    with:
      release: ${{ inputs.release }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}

  publish:
    needs: [build, prepare]
    uses: ./.forgejo/workflows/publish.yaml
    with:
      release: ${{ inputs.release }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
    secrets: inherit

  cleanup:
    needs: [prepare, publish]
    uses: ./.forgejo/workflows/cleanup.yaml
    with:
      release: ${{ inputs.release }}
      commit: ${{ needs.prepare.outputs.commit }}

      

  cleanup-fail:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    if: ${{ failure() || cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4        
      - name: Remove Branch
        run: |
          git push origin --delete release-${{needs.prepare.outputs.version}} || true
          git push origin --delete v${{needs.prepare.outputs.version}} || true
