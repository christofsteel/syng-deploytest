name: Make a new Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Type of Release"
        required: true
        type: choice
        options:
          - release
          - prerelease
          - dev
jobs:
  prepare:
    uses: ./.forgejo/workflows/prepare.yaml
    with:
      release: ${{ inputs.release }}

  build:
    needs: prepare
    uses: ./.forgejo/workflows/build.yaml
    with:
      release: ${{ inputs.release }}
      version: ${{ needs.prepare.output.version }}
      commit: ${{ needs.prepare.output.commit }}

  publish:
    needs: build
    uses: ./.forgejo/workflows/publish.yaml
    with:
      release: ${{ inputs.release }}
      version: ${{ needs.prepare.output.version }}
      commit: ${{ needs.prepare.output.commit }}
    secrets: inherit


  cleanup:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    if: ${{ failure() || cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4        
      - name: Remove Branch
        run: |
          git push origin --delete release-${{needs.prepare.outputs.version}} || true
          git push origin --delete v${{needs.prepare.outputs.version}} || true
