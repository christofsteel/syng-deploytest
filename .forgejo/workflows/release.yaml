name: Make a new Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Type of Release"
        required: true
        type: choice
        options:
          - release
          - prerelease
          - dev
      flatpak:
        description: "Build Flatpak"
        required: false
        type: boolean
        default: true

jobs:
  print-inputs-release:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ github.event.client_payload.message }} > /dev/stderr

  prepare:
    uses: ./.forgejo/workflows/prepare.yaml
    with:
      release: ${{ inputs.release }}
      flatpak: ${{ inputs.flatpak }}
      repo_name: christofsteel/syng-deploytest
    secrets: inherit

  build:
    needs: prepare
    uses: ./.forgejo/workflows/build.yaml
    with:
      release: ${{ inputs.release }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      image_name: christofsteel/syngtesting
      flatpak: ${{ inputs.flatpak }}

  publish:
    needs: [build, prepare]
    uses: ./.forgejo/workflows/publish.yaml
    with:
      release: ${{ inputs.release }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      image_name: christofsteel/syngtesting
      flatpak_repo: christofsteel/testrepo
      repo_name: christofsteel/syng-deploytest
      flatpak: ${{ inputs.flatpak }}
    secrets: inherit

  cleanup:
    needs: [prepare, publish]
    uses: ./.forgejo/workflows/cleanup.yaml
    with:
      release: ${{ inputs.release }}
      commit: ${{ needs.prepare.outputs.commit }}
      flatpak: ${{ inputs.flatpak }}

      

  cleanup-fail:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    if: ${{ failure() || cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4        
      - name: Remove Branch
        run: |
          git remote add codeberg https://christofsteel:${{ secrets.SYNG_CODEBERG }}@codeberg.org/${{ inputs.repo_name }}
          git remote add github https://${{ secrets.GH_TESTREPO_CONTENTS_WRITE }}@github.com/${{ inputs.repo_name }}

          git push origin --delete release-${{needs.prepare.outputs.version}} || true
          git push origin --delete v${{needs.prepare.outputs.version}} || true
          git push github --delete release-${{needs.prepare.outputs.version}} || true
          git push github --delete v${{needs.prepare.outputs.version}} || true
          git push codeberg --delete release-${{needs.prepare.outputs.version}} || true
          git push codeberg --delete v${{needs.prepare.outputs.version}} || true
