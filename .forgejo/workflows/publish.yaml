name: Publish artifacts

on:
  workflow_call:
    inputs:
      version:
        description: 'version tag'
        required: true
        type: string
      release:
        description: 'Type of Build'
        required: true
        type: string
      commit:
        description: 'commit hash'
        required: true
        type: string
      image_name:
        required: true
        type: string
      flatpak_repo:
        required: true
        type: string
      repo_name:
        required: true
        type: string
        

jobs:
  publish-docker:
    uses: ./.forgejo/workflows/docker.yaml
    with:
      version: ${{ inputs.version }}
      commit: ${{ inputs.sha }}
      push: "true"
      release: ${{ inputs.type }}
      image_name: ${{ inputs.image_name }}
    secrets: inherit

  publish-flathub:
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.k-fortytwo.de/christofsteel/call-external-workflow@6c91450b5ed0b94da7d517441446c02208ede566
        with:
          auth-token: ${{ secrets.GH_TESTREPO }}
          repo: ${{ inputs.flatpak_repo }}
          event: trigger-workflow
          payload: |
            {
              "url":" https://git.k-fortytwo.de/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_id }}/artifacts/flatpak-yaml-files"
            }

  publish-pypi:
    runs-on: ubuntu-latest
    if: ${{ inputs.release == 'release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"      
      - name: Upload to pypi-test
        run: |
          uv build
          uv publish --index testpypi --token ${{ secrets.SYNG_PYPI_TEST }}

  publish-release:
    runs-on: ubuntu-latest
    if: ${{ inputs.release == 'release' || inputs.release == 'prerelease' }}
    steps:
      - name: check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: ensure dist
        run: mkdir dist/
      - name: download artifact
        uses: actions/download-artifact@v3
        with:
          path: dist
      - name: clean and flatten
        run: |
          rm -rf dist/flatpak-yaml-files || true
          mv dist/**/* dist/
          rmdir dist/* || true
      - run: ls -alh dist/
      - uses: actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-notes-assistant: true
          tag: v${{ inputs.version }}
          sha: ${{ inputs.commit }}
          release-dir: dist
          prerelease: ${{ inputs.release != 'release' }}
          override: true
          verbose: true
      - uses: https://git.k-fortytwo.de/actions/gh-release@v1
        with:
          repo: ${{ inputs.repo_name }}
          auth-token: ${{ secrets.SYNG_GITHUB }}
          tag: v${{ inputs.version }}
          release-dir: dist
          prerelease: ${{ inputs.release != 'release }}
