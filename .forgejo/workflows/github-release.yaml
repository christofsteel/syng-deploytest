name: draft a release on github (testrepo)

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/ncipollo/release-action@v1
        with:
          owner: christofsteel
          repo: testrepo
          tag: v2.4.0
          token: ${{ secrets.GH_TESTREPO }}
