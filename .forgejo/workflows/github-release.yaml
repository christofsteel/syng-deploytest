name: draft a release on github (testrepo)

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir dist
          echo "123" >> dist/foo
          echo "1234" >> dist/bar
      - run: ls -alh > /dev/stderr
      - uses: https://git.k-fortytwo.de/actions/gh-release@v1
        with:
          repo: christofsteel/testrepo
          tag: gh-testrelease
          auth-token: ${{ secrets.GH_TESTREPO_CONTENTS_WRITE }}
          commitish: main
          release-dir: dist
