name: draft a release on github (testrepo)

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ls -alh > /dev/stderr
      - uses: https://git.k-fortytwo.de/actions/gh-release@2a5037bb43bda207044359505782ceb152db24ff
        with:
          repo: christofsteel/testrepo
          tag: gh-testrelease
          auth-token: ${{ secrets.GH_TESTREPO_CONTENTS_WRITE }}
          commitish: main
          files: |
            pyproject.toml
            uv.lock
