name: draft a release on github (testrepo)

on:
  workflow_dispatch: {}

jobs:
  runs-on: ubuntu-latest
  release:
    steps:
      - uses: actions/checkout@v4
      - uses: ncipollo/release-action@v1
        with:
          owner: christofsteel
          repo: testrepo
          token: ${{ secrets.GH_TESTREPO }}
